name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip tox
      - run: tox -e lint,docs

  test:
    name: py${{ matrix.python }} / ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django: ["dj52", "dj60", "dj61"]
        exclude:
          # Django 6.x requires Python 3.12+
          - { python: "3.10", django: "dj60" }
          - { python: "3.10", django: "dj61" }
          - { python: "3.11", django: "dj60" }
          - { python: "3.11", django: "dj61" }
        include:
          - { python: "3.14", django: "djmain" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip tox
      - name: Run tox
        run: tox -e py-${{ matrix.django }}
        continue-on-error: ${{ matrix.django == 'djmain' }}

  selenium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group test --group selenium .
      - run: python -m pytest -m selenium -v
        env:
          HITCOUNT_SELENIUM: "1"
          HITCOUNT_SELENIUM_BROWSER: chrome

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
