[tox]
requires =
    tox>=4.22
env_list =
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj{60,61}
    py{312,313,314}-djmain
    lint
    docs
skip_missing_interpreters = true

[testenv]
package = wheel
dependency_groups = test
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    PYTHONWARNINGS = always::DeprecationWarning
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
commands =
    coverage run -m pytest {posargs}
    coverage report
ignore_outcome =
    djmain: true

[testenv:lint]
skip_install = true
dependency_groups = lint
commands =
    ruff check .

[testenv:docs]
dependency_groups = docs
commands =
    sphinx-build -W -b html docs {env_tmp_dir}{/}html
